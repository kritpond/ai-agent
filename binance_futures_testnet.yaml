# Binance USD-M Futures Testnet settings. Not used by the existing spot agent.
symbols:
  - BTC/USDT:USDT
  - ETH/USDT:USDT
  - SOL/USDT:USDT
lookback_days: 14
poll_seconds: 60
leverage: 3                 # hard-coded maximum in the agent: 5x
risk_per_trade_pct: 0.0025  # equity risk estimated to the ATR stop, before gaps/slippage
max_notional_equity_pct: 0.15
max_daily_loss_pct: 0.02
stop_atr_multiple: 1.5
take_profit_atr_multiple: 2.0
min_confidence: 0.60
fees_bps: 5.0
state_file: data/binance_futures_testnet_state.json
trade_log: data/binance_futures_testnet_trades.jsonl
