# Binance Spot Testnet agent configuration. This is separate from the existing research config.
symbols:
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
lookback_days: 14
poll_seconds: 60
risk_per_trade_pct: 0.0025
max_position_pct: 0.15
max_daily_loss_pct: 0.02
stop_atr_multiple: 1.5
take_profit_atr_multiple: 2.0
min_confidence: 0.60
fees_bps: 10.0
state_file: data/binance_testnet_state.json
trade_log: data/binance_testnet_trades.jsonl
